spring.application.name=lifedesk
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

resend.api.key= ${RESEND_API_KEY}

jwt.secret =${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope[0]=openid
spring.security.oauth2.client.registration.google.scope[1]=profile
spring.security.oauth2.client.registration.google.scope[2]=email

spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL}
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}
spring.ai.openai.chat.model=${SPRING_AI_OPENAI_CHAT_MODEL}

spring.ai.mcp.server.protocol=streamable
spring.ai.mcp.server.annotation-scanner.enabled=true

spring.security.oauth2.client.registration.google-calendar.provider=google
spring.security.oauth2.client.registration.google-calendar.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google-calendar.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google-calendar.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google-calendar.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google-calendar.scope[0]=openid
spring.security.oauth2.client.registration.google-calendar.scope[1]=profile
spring.security.oauth2.client.registration.google-calendar.scope[2]=email
spring.security.oauth2.client.registration.google-calendar.scope[3]=https://www.googleapis.com/auth/calendar.events
spring.security.oauth2.client.registration.google-calendar.client-name=Google Calendar

app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
app.backend.url=${APP_BACKEND_URL:http://localhost:8080}


